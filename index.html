<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charley Yang Hub</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>

  <!-- Toggle Switch Button -->
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
    <span>Toggle Theme</span>
  </button>

  <header>
    <h1>Charley Yang Hub</h1>
    <p>The fanmade hub for everything about Charley Yang! From links to photos to songs.</p>
  </header>

  <main class="hub-grid">
    <!-- Link to BoyWithUke Page -->
      <a href="boywithuke.html" class="hub-card logo-card">
      <img src="assets/logos/boywithuke/lightmode.png" alt="BoyWithUke Logo Light" class="logo-light" />
      <img src="assets/logos/boywithuke/darkmode.png" alt="BoyWithUke Logo Dark" class="logo-dark" />
    </a>

    <!-- Link to Chandol Page (Dynamic Light/Dark Logo) -->
    <a href="chandol.html" class="hub-card logo-card">
      <img src="assets/logos/chandol/lightmode.png" alt="Chandol Logo Light" class="logo-light" />
      <img src="assets/logos/chandol/darkmode.png" alt="Chandol Logo Dark" class="logo-dark" />
    </a>


    <a href="photos.html" class="hub-card">
      <img src="assets/logos/camera/lightmode.png" alt="Chandol Logo Light" class="logo-light" />
      <img src="assets/logos/camera/darkmode.png" alt="Chandol Logo Dark" class="logo-dark" />
    </a>

    <a href="discography.html" class="hub-card">
      <img src="assets/logos/discog/lightmode.png" alt="Chandol Logo Light" class="logo-light" />
      <img src="assets/logos/discog/darkmode.png" alt="Chandol Logo Dark" class="logo-dark" />
    </a>
  </main>

  <footer>
    <p>"charyang.top" is not associated with Charley Yang, or anyone apart of Charley's team/family.</p>
  </footer>

</body>
</html>
